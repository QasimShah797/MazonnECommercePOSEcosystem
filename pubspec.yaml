name: mazon_ecommerce_pos_ecosystem
description: Mazonn — a premium e-commerce platform built for a future POS ecosystem.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  go_router: ^16.2.0
  google_fonts: ^6.3.2
  fl_chart: ^1.1.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.0
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.6.0
  firebase_storage: ^13.5.0
  image_picker: ^1.2.3
  cached_network_image: ^4.0.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/banners/
    - assets/products/
